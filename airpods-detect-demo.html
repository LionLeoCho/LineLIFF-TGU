<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>掃描 AirPods 觸發特效(免訓練版)</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
<style>
  html, body { margin:0; height:100%; background:#0b132b; font-family:"PingFang TC","Microsoft JhengHei",sans-serif; overflow:hidden; }
  #start-overlay {
    position:fixed; inset:0; z-index:20; background:#0b132b; color:#fff;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    gap:16px; text-align:center; padding:24px;
  }
  #start-overlay h1 { font-size:22px; margin:0; letter-spacing:2px; }
  #start-overlay p { font-size:13px; color:#a9b4c2; line-height:1.8; max-width:320px; margin:0; }
  #start-overlay img { width:120px; border-radius:12px; background:#fff; }
  #start-btn {
    font-size:18px; padding:12px 44px; border:none; border-radius:999px;
    background:#5bc0be; color:#0b132b; font-weight:700; letter-spacing:2px;
  }
  #cam-wrap { position:fixed; inset:0; }
  video { width:100%; height:100%; object-fit:cover; }
  #status {
    position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:10;
    background:rgba(11,19,43,.78); color:#fff; padding:8px 18px;
    border-radius:999px; font-size:13px; display:none; white-space:nowrap;
  }
  #ctrl {
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:10;
    background:rgba(11,19,43,.78); color:#fff; padding:10px 18px;
    border-radius:14px; font-size:12px; display:none; text-align:center;
  }
  #ctrl input { width:200px; }
  #fx {
    position:fixed; inset:0; z-index:15; pointer-events:none;
    display:none; justify-content:center; align-items:center;
  }
  #fx .badge {
    background:rgba(11,19,43,.85); border:2px solid #5bc0be; border-radius:20px;
    padding:20px 32px; text-align:center; color:#fff; animation:pop .4s ease-out;
  }
  #fx .badge .big { font-size:34px; }
  #fx .badge .title { font-size:20px; font-weight:700; margin-top:6px; }
  #fx .badge .sub { font-size:13px; color:#5bc0be; margin-top:4px; }
  @keyframes pop { from { transform:scale(.5); opacity:0; } to { transform:scale(1); opacity:1; } }
  .confetti { position:fixed; top:-20px; z-index:14; pointer-events:none; font-size:24px; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); opacity:.8; } }
</style>
</head>
<body>

<script>
  let net, refEmbedding, rafId, hitCooldown = false;
  let threshold = 0.55;

  const video   = document.getElementById('cam');
  const overlay = document.getElementById('start-overlay');
  const status  = document.getElementById('status');
  const ctrl    = document.getElementById('ctrl');
  const fx      = document.getElementById('fx');
  const refImg  = document.getElementById('ref-img');

  document.getElementById('th').addEventListener('input', e => {
    threshold = parseFloat(e.target.value);
    document.getElementById('th-val').textContent = threshold.toFixed(2);
  });

  document.getElementById('start-btn').addEventListener('click', async () => {
    overlay.querySelector('p').textContent = '模型載入中…(第一次約 5~10 秒)';
    try {
      net = await mobilenet.load({ version: 2, alpha: 1.0 });
      // 計算參考圖 embedding(L2 normalize)
      refEmbedding = tf.tidy(() => {
        const emb = net.infer(refImg, true);
        return emb.div(emb.norm());
      });
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" }, audio: false
      });
      video.srcObject = stream;
      overlay.style.display = 'none';
      status.style.display = 'block';
      ctrl.style.display = 'block';
      loop();
    } catch (e) {
      overlay.querySelector('p').textContent = '載入失敗:' + e.message + '(請確認以 HTTPS 開啟並允許相機)';
    }
  });

  async function loop() {
    if (video.readyState >= 2) {
      const sim = tf.tidy(() => {
        const emb = net.infer(video, true);
        const normed = emb.div(emb.norm());
        return normed.mul(refEmbedding).sum().dataSync()[0];
      });
      status.textContent = `🔍 相似度:${(sim * 100).toFixed(0)}%(門檻 ${(threshold*100).toFixed(0)}%)`;
      if (sim >= threshold && !hitCooldown) triggerFX();
    }
    rafId = requestAnimationFrame(loop);
  }

  function triggerFX() {
    hitCooldown = true;
    fx.style.display = 'flex';
    spawnConfetti();
    if (navigator.vibrate) navigator.vibrate(200);
    setTimeout(() => { fx.style.display = 'none'; hitCooldown = false; }, 5000);
  }

  function spawnConfetti() {
    const emojis = ['🎉','✨','🎧','⭐','🎊'];
    for (let i = 0; i < 30; i++) {
      const el = document.createElement('div');
      el.className = 'confetti';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
      el.style.animationDelay = (Math.random() * .5) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }
  }
</script>
</body>
</html>
